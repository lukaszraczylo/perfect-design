name: Docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.26.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @perfect-design/ui typecheck
      - run: pnpm --filter @perfect-design/ui test
      - run: pnpm --filter docs build
      - name: Add CNAME
        run: cp docs/public/CNAME docs/dist/CNAME
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist
          # v4 and later drop dotfiles by default; the site serves /.well-known/ard.json for agent discovery.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
