name: Release

# GitHub is the primary distribution channel: every tag produces a GitHub Release with the packed
# npm tarball attached. The npm registry publish is best-effort and never fails the release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @perfect-design/ui typecheck
      - run: pnpm --filter @perfect-design/ui test

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Trusted publishing: npmjs.com accepts this workflow's OIDC identity as the publish credential.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      # No registry-url: it would write an _authToken placeholder into .npmrc, which disables the
      # OIDC exchange that trusted publishing relies on.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Build library
        run: pnpm --filter @perfect-design/ui build

      - name: Set the package version from the tag
        working-directory: packages/ui
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Pack the tarball
        working-directory: packages/ui
        run: |
          npm pack
          TARBALL=$(ls ./*.tgz | head -n1)
          echo "TARBALL=$(basename "$TARBALL")" >> "$GITHUB_ENV"

      - name: GitHub Release with the tarball attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "packages/ui/$TARBALL" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "packages/ui/$TARBALL" \
              --title "perfect-design $GITHUB_REF_NAME" \
              --generate-notes \
              --notes "Install from this release:

          \`\`\`
          npm install https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/$TARBALL
          \`\`\`
          "
          fi

      - name: Attach the tarball to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: perfect-design-ui-${{ github.ref_name }}
          path: packages/ui/${{ env.TARBALL }}
          if-no-files-found: error

      # Optional mirror through trusted publishing: npmjs.com has this workflow registered as the
      # package's trusted publisher, so the run's OIDC identity is the credential and no secret is
      # needed. A registry rejection never fails the release: GitHub already has the tarball.
      - name: Publish to npm (trusted publishing, optional mirror)
        working-directory: packages/ui
        continue-on-error: true
        run: |
          # OIDC publishing needs npm 11.5 or newer; the Node 22 toolchain ships npm 10.
          npm install -g npm@11.21.2
          VERSION=$(node -p "require('./package.json').version")
          # The Sigstore transparency log occasionally resets the connection, which fails the
          # publish after the tarball upload; retry, and treat an already-present version as done.
          for attempt in 1 2 3; do
            if npm publish --provenance --access public; then
              echo "::notice::published @perfect-design/ui@$VERSION to npm"
              exit 0
            fi
            if npm view "@perfect-design/ui@$VERSION" version >/dev/null 2>&1; then
              echo "::notice::@perfect-design/ui@$VERSION is already on the registry"
              exit 0
            fi
            echo "::warning::npm publish attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          exit 1
